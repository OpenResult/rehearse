name: CI

"on":
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / ${{ matrix.configuration }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        configuration: [default, manual, serde, all]
        include:
          - configuration: default
            features: ""
          - configuration: manual
            features: --no-default-features
          - configuration: serde
            features: --no-default-features --features serde
          - configuration: all
            features: --all-features
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      # Select the library crates explicitly so the filing CLI's macro dependency
      # does not enable macros in the manual and serde-only configurations.
      - run: cargo clippy -p rehearse -p rehearse-macros --all-targets ${{ matrix.features }} --locked -- -D warnings
      - run: cargo test -p rehearse -p rehearse-macros ${{ matrix.features }} --locked
      - run: cargo doc -p rehearse -p rehearse-macros --no-deps ${{ matrix.features }} --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - if: matrix.configuration == 'all'
        run: cargo clippy -p rehearse-filing-example --all-targets --locked -- -D warnings
      - if: matrix.configuration == 'all'
        run: cargo test -p rehearse-filing-example --locked

  packaging:
    name: Packaging and Rust 1.85 consumers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: rustup toolchain install 1.85.0 --profile minimal
      - run: cargo +1.85.0 check --workspace --lib --all-features --locked
      - run: cargo +1.85.0 check -p rehearse --lib --no-default-features --locked
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: scripts/publish-local.sh
        env:
          REHEARSE_CONSUMER_TOOLCHAIN: 1.85.0
      - run: cargo run -p rehearse --example read_after_write --locked
      - run: cargo run -p rehearse --example deploy --locked -- --help
