[package]
name = "rehearse-workflow-example"
default-run = "rehearse-workflow-example"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "A local CI/CD workflow lab demonstrating rehearse"
publish = false

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
clap = { version = "4", features = ["derive"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
rehearse = { path = "../rehearse", features = ["serde"] }
rehearse-github = { path = "../rehearse-github" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# sha2 0.11.1 requires Rust 1.88; this example supports Rust 1.85.
sha2 = "=0.11.0"
tokio = { version = "1", features = ["macros", "rt", "net", "sync", "time", "signal", "io-util"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
